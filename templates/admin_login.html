<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopEase Admin Login</title><link rel="stylesheet" href="{{ url_for('static',filename='admin.css') }}"></head>
<body class="login-page"><main class="login-card"><a class="admin-brand" href="/">ShopEase</a><p class="eyebrow">ADMINISTRATION</p><h1>Welcome back</h1><p class="muted">Sign in to manage your store analytics and styles.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<p class="notice error">{{ message }}</p>{% endfor %}{% endwith %}<form method="post"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="primary full" type="submit">Sign in</button></form><a class="back-link" href="/">← Back to ShopEase</a></main></body></html>
